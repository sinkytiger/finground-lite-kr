name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (offline, recorded DART fixtures)
        run: pytest -q
      - name: Benchmark smoke (generate + E1 on fixtures)
        run: |
          python -m bench.generate --cache tests/fixtures/dart --offline --companies 00126380 --years 2025 2026 --out /tmp/bench.jsonl
          python -m bench.evaluate /tmp/bench.jsonl --cache tests/fixtures/dart --offline --out /tmp/e1.md
