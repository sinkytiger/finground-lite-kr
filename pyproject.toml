[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finground-lite-kr"
version = "0.1.1"
description = "Verify Korean financial claims against DART filings (Claude Code plugin + MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finground-kr = "finground_kr.cli:main"

[tool.setuptools]
packages = ["finground_kr"]

[tool.setuptools.package-data]
finground_kr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
